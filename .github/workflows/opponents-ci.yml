name: Opponents and Strategy
on:
  push:
    branches: [main, feature/opponents-scouting-strategy-lock]
  pull_request:
jobs:
  opponent-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify reviewed migration copy
        run: cmp docs/sql/OPPONENTS-SCOUTING.sql supabase/migrations/20261105075301_opponents_scouting.sql
      - name: Replay additive schema and run role checks
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/fixtures/opponents-bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/sql/OPPONENTS-SCOUTING.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/verify-opponents-db.sql
