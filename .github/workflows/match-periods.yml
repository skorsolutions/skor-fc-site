name: Match periods and post-game recording
on:
  push:
    branches: [main, feature/match-periods, feature/post-match-penalties, feature/post-match-goals]
  pull_request:
jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise proposed migration in disposable Postgres
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/fixtures/tiebreaks-bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/sql/MATCH-TIEBREAKS.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/verify-tiebreaks-db.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/fixtures/public-results-bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/sql/PUBLIC-MATCH-RESULTS.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/verify-public-results-db.sql
  browser-and-unit:
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Existing regressions and new match-period cases
        run: node -e 'const p=require("./package.json"),c=require("node:child_process");for(const s of Object.values(p.scripts))c.execSync(s,{stdio:"inherit"});'
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/match-browser" --save-exact playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo "SKOR_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/match-browser/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          fi
      - name: Verify phone and desktop event/clock controls
        run: SKOR_PLAYWRIGHT_PATH="$RUNNER_TEMP/match-browser/node_modules/playwright" node tests/browser-match-periods.mjs
      - name: Verify public final scores and private discipline on phones and desktop
        run: SKOR_PLAYWRIGHT_PATH="$RUNNER_TEMP/match-browser/node_modules/playwright" node tests/browser-public-results.mjs

      - name: Verify signed-out deployed Match Center
        if: github.ref == 'refs/heads/main'
        run: SKOR_PLAYWRIGHT_PATH="$RUNNER_TEMP/match-browser/node_modules/playwright" SKOR_RESULTS_LIVE=https://skorfc.net node tests/browser-public-results.mjs
